-
  name: kitchen_switchs_get_state
  conditions:
    -
      type: query
      area: kitchen
      domain: switch
  sentences:
    - "What's the status of the kitchen switches?"
    - 'Tell me the state of all kitchen switches'
    - 'Please check the kitchen switches for me'
    - "If you don't mind, what's the current state of the kitchen switches?"
    - 'Kitchen switches status'
    - 'Could you show me the kitchen switch states please'
    - 'Report on all kitchen switches'
-
  name: kitchen_switchs_list_on_switchs
  conditions:
    -
      type: query
      area: kitchen
      domain: switch
  sentences:
    - "What's the status of the kitchen switches"
    - 'kitchen switches state'
    - "please tell me the current state of the kitchen switches if you don't mind"
    - 'get kitchen switch status'
    - 'can you check the kitchen switches for me'
    - 'kitchen switches current state please'
    - 'show me the kitchen switches status'
-
  name: kitchen_switchs_list_off_switchs
  conditions:
    -
      type: query
      area: kitchen
      domain: switch
  sentences:
    - "What's the status of the kitchen switches?"
    - 'Tell me the state of all kitchen switches'
    - "Please check the kitchen switches for me if you don't mind"
    - 'Kitchen switches status'
    - 'Could you show me the current state of the switches in the kitchen'
    - 'Get kitchen switch states'
    - 'If possible, report the kitchen switches status please'
