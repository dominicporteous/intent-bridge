name: lock_and_all_lights_off_at_11pm
sentences:
- Create an automation to lock the front door and turn off all lights at 11pm every
  night
- Set up a nightly rule at eleven to lock the front door and switch all lights off
- Make an automation at 11pm to lock the front door and kill every light # Changed from: Make an automation at 11pm to lock up and kill every light
