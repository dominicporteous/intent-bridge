    - 'Could you adjust the entryway chandelier to 77 percent for me'
    - 'Make the Entry Chandelier 77 brightness'
    - 'If possible, set entryway light brightness level to 77'
-
  name: light_entryway_chandelier_change_color
  conditions:
    -
      type: action
      entity_id: light.entryway_chandelier
      attributes:
        color: orange
  sentences:
    - 'Turn the entryway chandelier orange'
    - 'Flick the Entry Chandelier to orange'
    - 'Please set the light entryway chandelier to orange for me'
    - "If you don't mind, flip the entryway chandelier to orange"
    - 'Change Entry Chandelier color to orange'
    - 'Make the entryway chandelier orange please'
    - 'Set the Entry Chandelier to orange in the entryway'
