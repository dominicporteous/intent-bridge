-
  name: bathroom_and_kitchen_lights_turn_on
  setup:
    -
      entity_id:
        id: light.bathroom_mirror_light
        area_id: bathroom
        name: 'Mirror Light'
        state: 'off'
        domain: light
      state: 'off'
    -
      entity_id:
        id: light.kitchen_ceiling_lights
        area_id: kitchen
        name: 'Ceiling Lights'
        state: 'on'
        attributes:
          brightness: 80
          color: white
        domain: light
      state: 'off'
    -
      entity_id:
        id: light.kitchen_under_cabinet_lights
        area_id: kitchen
        name: 'Under Cabinet Lights'
        state: 'off'
        attributes:
          brightness: 100
        domain: light
      state: 'on'
  conditions:
    -
      entity_id:
        id: light.bathroom_mirror_light
        area_id: bathroom
        name: 'Mirror Light'
        state: 'off'
        domain: light
      state: 'on'
    -
      entity_id:
        id: light.kitchen_ceiling_lights
        area_id: kitchen
        name: 'Ceiling Lights'
        state: 'on'
        attributes:
          brightness: 80
          color: white
        domain: light
      state: 'on'
    -
      entity_id:
        id: light.kitchen_under_cabinet_lights
        area_id: kitchen
        name: 'Under Cabinet Lights'
        state: 'off'
        attributes:
          brightness: 100
        domain: light
      state: 'on'
  sentences:
    -
      - 'What is the status of the lights in the bathroom and kitchen?'
      - 'Please flick them off for me.' # Changed from: Please flick them on for me.
    -
      - 'Can you tell me the state of the bathroom and kitchen lights?'
      - "Flip them off if you don't mind." # Changed from: Flip them on if you don't mind.
    -
      - 'Show me the current status for the lights in the bathroom and kitchen.'
      - 'Go ahead and turn them on.'
    -
      - 'Are the bathroom and kitchen lights on or off right now?'
      - 'Yeah, switch them on.'
    -
      - "What's the light status in the bathroom and kitchen?"
      - 'Hit them on please.'
    -
      - 'Report the status of the lights in the bathroom and kitchen.'
      - 'Activate them for me.'
    -
      - 'Tell me if the bathroom and kitchen lights are on.'
      - 'Turn them on now.'
